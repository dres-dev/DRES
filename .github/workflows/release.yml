name: Publish DRES Distribution and Docker Image

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release and upload the artefact
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache the Yarn cache
        uses: actions/cache@v4
        with:
          path: frontend/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('frontend/package.json', 'frontend/.yarnrc.yml') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Build distribution
        run: ./gradlew distTar --console=plain

      - name: Get the version
        id: get_version
        # `2.1.0` rather than `v2.1.0`: the tag prefix is not part of the version.
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      # `gh release` replaces actions/create-release@v1 and actions/upload-release-asset@v1, which are both
      # archived and no longer receive fixes. The distribution is uploaded in the same command.
      - name: Create release and upload the distribution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $VERSION" \
            --generate-notes \
            "backend/build/distributions/dres-dist.tar#dres-dist-$VERSION.tar"
