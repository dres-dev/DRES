import org.apache.tools.ant.taskdefs.condition.Os
import de.undercouch.gradle.tasks.download.Download

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-stdlib:$version_kotlin"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$version_kotlin"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$version_kotlin"
    }
}

apply plugin: 'application'
apply plugin: 'kotlin'
apply plugin: 'kotlinx-serialization'
apply plugin: 'kotlin-kapt'
apply plugin: 'idea'

application {
    mainClass = 'dev.dres.DRES'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

/* Configuration for frontend classpath files (see dependencies). */
configurations {
    frontendClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

repositories {
    mavenCentral()
    maven {
        url 'https://maven.reposilite.com/snapshots'
        allowInsecureProtocol = true
    } //javalin openapi snapshot
}

compileKotlin {
    kotlinOptions.jvmTarget = "17"
}
compileTestKotlin {
    kotlinOptions.jvmTarget = "17"
}

dependencies {

    ///// Frontend files (produced by sub-project).
    implementation frontendClasspath(project(path: ":frontend", configuration: 'frontendFiles'))

    ///// FFMpeg dependency
    implementation files("$buildDir/ext") {builtBy 'setupFFMpeg'}

    ///// Xodus & Xodus DNQ
    implementation group: 'org.jetbrains.xodus', name: 'xodus-openAPI', version: version_xodus
    implementation group: 'org.jetbrains.xodus', name: 'xodus-environment', version: version_xodus
    implementation group: 'org.jetbrains.xodus', name: 'xodus-entity-store', version: version_xodus
    implementation group: 'org.jetbrains.xodus', name: 'xodus-vfs', version:  version_xodus
    implementation group: 'org.jetbrains.xodus', name: 'dnq', version: version_xodus_dnq

    ////// Javalin
    implementation group: 'io.javalin', name:  'javalin', version: version_javalin
    kapt("io.javalin.community.openapi:openapi-annotation-processor:$version_javalinopenapi")

    implementation group: 'io.javalin.community.openapi', name: 'javalin-openapi-plugin', version: version_javalinopenapi
    implementation group: 'io.javalin.community.openapi', name:'javalin-swagger-plugin', version: version_javalinopenapi
    implementation group: 'io.javalin.community.ssl', name: 'javalin-ssl', version: version_javalinssl

    ////// Bcrypt
    implementation group: 'org.mindrot', name: 'jbcrypt', version: version_bcrypt

    ////// JLine 3, Clikt & Picnic for optimal terminal experience :-)
    implementation group: 'org.jline', name: 'jline-terminal', version: version_jline
    implementation group: 'org.jline', name: 'jline-reader', version: version_jline
    implementation group: 'org.jline', name: 'jline-builtins', version: version_jline
    implementation group: 'com.github.ajalt.clikt', name: 'clikt', version: version_clikt
    implementation group: 'com.jakewharton.picnic', name: 'picnic', version: version_picnic

    ///// Fuel
    implementation group: 'com.github.kittinunf.fuel', name: 'fuel', version: version_fuel

    ////// CSV
    implementation group: 'com.github.doyaaaaaken', name: 'kotlin-csv-jvm', version: version_kotlin_csv

    ////// Jaffree ffmpeg wrapper
    implementation group: 'com.github.kokorin.jaffree', name: 'jaffree', version: version_jaffree

    ////// Log4J
    implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: version_log4j
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: version_log4j
    implementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j2-impl', version: version_log4j
    implementation group: 'org.apache.logging.log4j', name: 'log4j-jul', version: version_log4j

    ////// FastUtil
    implementation group: 'it.unimi.dsi', name: 'fastutil', version: version_fastutil

    ///// JUnit 5
    testImplementation "org.jetbrains.kotlin:kotlin-test"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5"
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: version_junit
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: version_junit
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: version_junit

    ///// Jackson / Kotlin
    implementation group: 'com.fasterxml.jackson.module', name: 'jackson-module-kotlin', version: version_jackson_kotlin

    ///// Kotlin
    implementation group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib', version: version_kotlin
    implementation group: 'org.jetbrains.kotlin', name: 'kotlin-reflect', version: version_kotlin
    implementation group: 'org.jetbrains.kotlinx', name:'kotlinx-serialization-json', version: version_kotlinx_serialization
}

kapt {
    correctErrorTypes true
    useBuildCache true
}


test {
    useJUnitPlatform()
}

idea {
    module {
        downloadJavadoc = true
    }
}

sourceSets {
    main {
        resources {
            srcDir 'config'
        }
    }
}

distributions {
    main {
        distributionBaseName = 'dres-dist'
        contents {
            // Jaffree needs ffmpeg/ffprobe to be executable; the file dependency on build/ext loses the mode bits.
            filesMatching('**/ffmpeg/*') {
                permissions { unix('rwxr-xr-x') }
            }
        }
    }
}

/** Custom tasks: FFmpeg Download and deployment. */

/*
 * FFmpeg / FFprobe binaries, shipped in lib/ffmpeg (via build/ext).
 * Version 9.0.2, one self-contained build per platform, pinned by SHA-256:
 *  - linux-amd64:  Martin Riedl (ffmpeg.martin-riedl.de); needs only glibc, libstdc++, libgcc_s.
 *  - macos-*:      Martin Riedl, arm64 and amd64; only system frameworks/libraries.
 *  - windows-amd64: gyan.dev essentials build; single bin/ directory, no DLLs.
 * Binaries are verified by checksum after download and made executable in the copy.
 */
def ffmpegVersion = '9.0.2'

def ffmpegBuilds = [
    'linux-amd64'  : [
        ffmpeg : [url: 'https://ffmpeg.martin-riedl.de/download/linux/amd64/1789931100_9.0.2/ffmpeg.zip',
                  sha256: 'fa8ecf4abbd290d98f7d188b8649cc6b391ae209a98452be955a15aab1909d7f'],
        ffprobe: [url: 'https://ffmpeg.martin-riedl.de/download/linux/amd64/1789931100_9.0.2/ffprobe.zip',
                  sha256: '3f428c49070be3d24ec338602b76d412e401ffcb8a5641ef0e729181a232fc32'],
    ],
    'macos-arm64'  : [
        ffmpeg : [url: 'https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffmpeg.zip',
                  sha256: 'c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924'],
        ffprobe: [url: 'https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffprobe.zip',
                  sha256: 'fcbe839537485eaee7a7a8bc5cbc0f90d53617e80943e8a5b2e31cb851197ea6'],
    ],
    'macos-amd64'  : [
        ffmpeg : [url: 'https://ffmpeg.martin-riedl.de/download/macos/amd64/1789931006_9.0.2/ffmpeg.zip',
                  sha256: '7c6b4125b191cbf773832dc51f424cf2b6bb7da43007d1e066f95909e47cacd4'],
        ffprobe: [url: 'https://ffmpeg.martin-riedl.de/download/macos/amd64/1789931006_9.0.2/ffprobe.zip',
                  sha256: '2322438ed2f6319a691291b247d09c69dcaa3a982460d1f269a7e1af335cfdfd'],
    ],
    'windows-amd64': [
        ffmpeg : [url: 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip',
                  sha256: '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'],
        ffprobe: [url: 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip',
                  sha256: '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'],
    ],
]

def ffmpegPlatform = {
    // -PffmpegPlatform=<key> selects a build for another platform (e.g. windows-amd64, macos-arm64)
    if (project.hasProperty('ffmpegPlatform')) return project.property('ffmpegPlatform')
    def os = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch').toLowerCase()
    def arm = arch in ['aarch64', 'arm64']
    if (os.contains('windows')) return 'windows-amd64'
    if (os.contains('mac')) return arm ? 'macos-arm64' : 'macos-amd64'
    if (os.contains('linux') && !arm) return 'linux-amd64'
    return "unsupported-${os}-${arch}"
}

def ffmpegPlatformBuild = ffmpegBuilds[ffmpegPlatform()]

def verifySha256 = { File file, String expected ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        def buffer = new byte[65536]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    def actual = digest.digest().encodeHex().toString()
    if (actual != expected) {
        file.delete()
        throw new GradleException("SHA-256 mismatch for ${file.name}: expected ${expected}, got ${actual}")
    }
}

/* Unsupported platforms fail when the download runs, not at configuration time. */
def ffmpegSpec = { String tool -> ffmpegPlatformBuild?.get(tool) ?: [url: '', sha256: ''] }

task downloadFFmpeg(type: Download) {
    def spec = ffmpegSpec('ffmpeg')
    def f = new File("$buildDir/cache/ffmpeg-${ffmpegVersion}-${ffmpegPlatform()}.zip")
    src spec.url
    dest f
    onlyIf {
        !f.exists()
    }
    doFirst {
        if (ffmpegPlatformBuild == null) throw new GradleException("No FFmpeg build configured for ${ffmpegPlatform()}")
    }
    doLast {
        verifySha256(f, spec.sha256)
    }
}
task downloadFFprobe(type: Download) {
    def spec = ffmpegSpec('ffprobe')
    def f = new File("$buildDir/cache/ffprobe-${ffmpegVersion}-${ffmpegPlatform()}.zip")
    src spec.url
    dest f
    onlyIf {
        !f.exists()
    }
    doFirst {
        if (ffmpegPlatformBuild == null) throw new GradleException("No FFmpeg build configured for ${ffmpegPlatform()}")
    }
    doLast {
        verifySha256(f, spec.sha256)
    }
}
// Remove binaries of a previously selected platform (e.g. ffmpeg from Linux next to ffmpeg.exe).
task cleanFFmpegDir(type: Delete) {
    delete "$buildDir/ext/ffmpeg"
}
task copyFFmpeg(type: Copy) {
    dependsOn downloadFFmpeg, cleanFFmpegDir
    from zipTree(downloadFFmpeg.dest)
    into "$buildDir/ext/ffmpeg"
    include '**/ffmpeg', '**/ffmpeg.exe'
    includeEmptyDirs = false
    // flatten nested archive folders (gyan.dev ships bin/ffmpeg.exe)
    eachFile { it.path = it.name }
    filePermissions { unix('rwxr-xr-x') }
}
task copyFFprobe(type: Copy) {
    dependsOn downloadFFprobe, cleanFFmpegDir
    from zipTree(downloadFFprobe.dest)
    into "$buildDir/ext/ffmpeg"
    include '**/ffprobe', '**/ffprobe.exe'
    includeEmptyDirs = false
    eachFile { it.path = it.name }
    filePermissions { unix('rwxr-xr-x') }
}

task setupFFMpeg(type: Copy) {
    dependsOn downloadFFmpeg
    dependsOn downloadFFprobe
    dependsOn copyFFmpeg
    dependsOn copyFFprobe
}

startScripts {
    doLast {
        windowsScript.text = windowsScript.text.replaceAll('set CLASSPATH=.*', 'set CLASSPATH=.;%APP_HOME%/lib/*')
    }
}

/* Exclude logback-classic. 8. July 2024: Leak comes from openapi-annotation */
configurations.configureEach {
    exclude module: "logback-classic"
}
