buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    /// Download task for FFMPEG binaries download
    id 'de.undercouch.download' version '5.7.0'

    /// OpenAPI Generator for Frontend internal api generation
    id 'org.openapi.generator' version '7.26.0'
}

/// Variables used for Open API generation.
def fullOAS = 'http://localhost:8080/openapi.json'
def clientOAS = 'http://localhost:8080/clientapi.json'
def oasFile = "${project.projectDir}/doc/oas.json"
def clientOasFile = "${project.projectDir}/doc/oas-client.json"

/// Generates the openapi frontend bindings
openApiGenerate {
    /// Source command:
    /// openapi-generator generate -g typescript-angular -i http://localhost:8080/swagger-docs -o openapi --skip-validate-spec --additional-properties npmName=@dres-openapi/api,snapshot=true,ngVersion=9.1.0
    generateApiTests = false // No tests please
    generateModelTests = false // No tests please
    validateSpec = false // No validation please (as in command above)
    skipValidateSpec = true

    generatorName = 'typescript-angular'
    inputSpec = oasFile
    outputDir = file("${project.projectDir}/frontend/openapi").toString()
    configOptions = [
        npmName: '@dres-openapi/api',
        ngVersion: '21.2.25',
        snapshot: 'true', /// I suggest to remove this, as soon as we automate this,
        enumPropertyNaming: 'original'
    ]
}

tasks.register('generateOAS', Download) {
    /* Requires DRES running on default port */
    def f = new File(oasFile)
    src fullOAS
    dest f
}

tasks.register('generateClientOAS', Download) {
    def f = new File(clientOasFile)
    src clientOAS
    dest f
}

/*
 * `openApiGenerate` reads doc/oas.json, which generateOAS writes. Without this dependency Gradle 9 fails the
 * build with "uses this output of task ':generateOAS' without declaring an explicit or implicit dependency"
 * as soon as both are requested in one invocation - which is exactly how regeneration is documented.
 */
/*
 * Regenerates the committed specification, the client specification and the generated TypeScript client in
 * the right order. Requires a running DRES on the default port.
 */
tasks.register('regenerateApi') {
    group = 'documentation'
    description = 'Regenerates doc/oas.json, doc/oas-client.json and frontend/openapi from a running DRES.'
    dependsOn 'generateOAS', 'generateClientOAS', 'openApiGenerate'
    /* Makes openApiGenerate consume the freshly downloaded spec rather than the committed one. */
    tasks.named('openApiGenerate') { dependsOn 'generateOAS'; mustRunAfter 'generateClientOAS' }
}

/*
 * Ordering is declared after both tasks exist. `openApiGenerate` deliberately does NOT depend on
 * `generateOAS`: that would make every ordinary build require a running server. The dependency only
 * exists inside `regenerateApi`, which is the task that actually means "re-download the spec first".
 */
tasks.named('generateClientOAS').configure { mustRunAfter 'generateOAS' }
