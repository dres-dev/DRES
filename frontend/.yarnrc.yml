approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

yarnPath: .yarn/releases/yarn-4.18.1.cjs

# `yarn.lock` is intentionally not committed (see .gitignore: it is generated by the Gradle build), so
# there is nothing for Yarn to compare against. In CI Yarn defaults to --immutable and then refuses every
# install with YN0028, which broke the frontend build on any clean clone - including the release workflow.
enableImmutableInstalls: false
